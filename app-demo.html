<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工银智养仓 · 手机银行适配判断</title>
<style>
:root{--red:#D00F1B;--red2:#A50C15;--navy:#12335B;--ink:#243244;--mut:#65758A;--line:#D8E0E9;--bg:#F4F6F9;--blue:#2466A8;--green:#4A7C69;--amber:#B8893E;--lr:#FBF0F1;--lb:#EDF4FB;--lg:#EEF4F1;--la:#FAF4E9;--r:4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:15px;line-height:1.7}#app{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 40px rgba(18,51,91,.08);display:flex;flex-direction:column}header{padding:12px 20px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.brand{display:flex;align-items:center;gap:8px}.logo{width:20px;height:20px;background:var(--red);border-radius:2px;position:relative}.logo:after{content:"";position:absolute;inset:5px 4px;border-left:2px solid #fff;border-bottom:2px solid #fff}.brand b{font-size:14.5px}.brand i{font-style:normal;font-size:10px;color:var(--red);font-weight:700;border:1px solid var(--red);padding:0 4px;border-radius:2px}.brand span{margin-left:auto;font-size:11px;color:var(--mut)}.bar{height:2.5px;background:#E2E7EC;margin-top:10px}.bar i{display:block;height:100%;background:var(--red);width:12.5%;transition:.35s}main{flex:1;padding:22px 20px 28px}.pane{display:none;animation:in .3s ease}.pane.on{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}h1{font-size:21px;line-height:1.5;margin:0 0 10px}h1:after{content:"";display:block;width:44px;height:2.5px;background:var(--red);margin-top:10px}h2{font-size:18px;line-height:1.55;margin:0 0 9px}h3{font-size:14px;color:var(--navy);border-left:3px solid var(--red);padding-left:8px;margin:22px 0 8px}p{margin:0 0 12px}.lead{font-size:15px}.mut,.small{color:var(--mut)}.small{color:var(--mut)}.small{font-size:12.5px}.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 13px}.card h4{margin:0 0 5px;font-size:13.5px;color:var(--navy)}.blue{background:var(--lb);border-color:#C7DCF0}.green{background:var(--lg);border-color:#CFE0D8}.amber{background:var(--la);border-color:#EBDCBF}.red{background:var(--lr);border-color:#EFCDD1}.tag{display:inline-block;border:1px solid;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:700}.tag.a{color:var(--green);border-color:var(--green);background:#fff}.tag.b{color:var(--amber);border-color:var(--amber);background:#fff}.gate{display:flex;gap:9px;align-items:center;margin-bottom:16px}.n{width:25px;height:25px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border-radius:2px}.gate span{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.5px}.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0 22px}.opt{font:inherit;font-size:14px;text-align:left;background:#fff;border:1px solid var(--line);padding:12px;border-radius:var(--r);cursor:pointer;display:flex;gap:9px;align-items:center;position:relative}.opt:before{content:"";width:14px;height:14px;border:1.5px solid #AAB6C4;border-radius:50%;flex:none}.opt.sel{border-color:var(--navy);background:var(--lb)}.opt.sel:before{content:"";border:0;background:var(--navy)}.opt.sel:after{content:"";position:absolute;left:17px;top:50%;width:4px;height:7px;border-right:1.7px solid #fff;border-bottom:1.7px solid #fff;transform:translateY(-65%) rotate(45deg)}.opt i{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:2px}.btn{width:100%;border:0;border-radius:var(--r);background:var(--red);color:#fff;padding:14px;font:700 15px inherit;cursor:pointer}.btn:hover{background:var(--red2)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}.foot{padding:0 20px 26px}.formula{font-family:Consolas,monospace;font-size:12px;padding:10px 11px;background:#F7F9FC;border:1px solid var(--line);border-radius:var(--r);line-height:1.75}.ok{color:var(--green);font-weight:700}.warn{color:var(--amber);font-weight:700}.stop{color:var(--red);font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:1px solid var(--line);padding:11px;border-radius:var(--r);font-size:12.5px}.mini b{display:block;color:var(--navy);margin-bottom:5px}.crm{border-top:3px solid var(--navy)}.customer{border-top:3px solid var(--red)}.timeline{padding-left:15px;border-left:2px solid var(--line)}.timeline div{margin:0 0 14px;position:relative}.timeline div:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);position:absolute;left:-20px;top:8px}.disc{font-size:11px;color:var(--mut);border-top:1px solid var(--line);margin-top:19px;padding-top:10px}.notice{font-size:12.5px;padding:10px 11px;background:#F7F9FC;border-left:3px solid var(--blue);margin:12px 0 14px}.result{padding:18px 15px;border:1px solid #CFE0D8;border-top:3px solid var(--green);background:var(--lg);text-align:center;margin-bottom:15px}.result h2{color:var(--green);margin:5px 0}.result.stopr{border-color:#EFCDD1;border-top-color:var(--red);background:var(--lr)}.result.stopr h2{color:var(--red)}
.t0in{width:100%;border:2px solid var(--red);border-radius:var(--r);padding:13px 12px;font:700 18px "DIN Alternate","Microsoft YaHei",sans-serif;color:var(--navy);background:#fff;outline:none}.t0in:focus{box-shadow:0 0 0 3px rgba(208,15,27,.12)}
.btn.navy{background:var(--navy)}.btn.navy:hover{background:#0D2846}
.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.metric{border:1px solid var(--line);border-radius:var(--r);padding:9px 7px;background:#fff}.metric b{display:block;font-size:12px;color:var(--navy);line-height:1.4}.metric span{display:block;font-size:11px;color:var(--mut);line-height:1.4;margin-top:3px}.bartrack{display:flex;height:11px;border-radius:6px;overflow:hidden;background:#E2E7EC;margin:10px 0 6px}.barcover{background:var(--green)}.bargap{background:var(--amber)}.barzero{background:var(--line)}.subrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}
.portal{margin-left:auto;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:2px;padding:2px 6px;font:700 11px inherit;cursor:pointer}.portal+span{margin-left:0}
.opt.chk:before{border-radius:3px}.opt.chk.sel{border-color:#93B8A8;background:var(--lg)}.opt.chk.sel:before{content:"";border:0;background:var(--green)}
</style>
</head>
<body><div id="app"><header><div class="brand"><div class="logo"></div><b>ICBC 工银智养仓</b><i>原型演示</i><button id="portalBtn" class="portal" hidden onclick="set(6,'双端分流')">切换端口</button><span id="step">养老金专区</span></div><div class="bar"><i id="bar"></i></div></header><main id="main"></main><div class="foot" id="foot"></div></div>
<script src="engine.js"></script>
<script>
"use strict";
/* 税额内核（BRACKETS / LIMIT / RANGES / taxOf / rateOf / breakdown / saving / selfTest）
   全部来自 engine.js，与 index.html 共用同一份。本页禁止内联副本 —— 内联即意味着
   「相同 T0 在两版下必须得到相同税额」这句话失去可验证性。 */
const S={screen:0,
  /* U1 授权范围：三项均可独立勾选，未授权项不参与结论 */
  auth:{t0:false, paid:false, record:false},
  /* U2 用户可改的判断输入 */
  t0:null, t0Mode:'unknown', paidAmount:null, // paidAmount 为本年度已缴金额
  flow:{reserve:null, spend:null, lock:null, understand:null},
  gap:'need', category:null, humanChannel:'',
  gapGoal:null, gapCover:null, returnToCustomer:false,
  crmTaskRecorded:false};
const main=document.querySelector('#main'),foot=document.querySelector('#foot'),bar=document.querySelector('#bar'),step=document.querySelector('#step'),portalBtn=document.querySelector('#portalBtn');
const money=n=>Number(n).toLocaleString('zh-CN');
function set(n,label){
  S.screen=n;
  bar.style.width=((n+1)/10*100)+'%';
  step.textContent=label;
  render();
  /* 仅在跨页面时回到顶部；同页输入与勾选仍保留当前位置。 */
  window.scrollTo(0,0);
}
function opt(key,value,text,sub){return `<button class="opt ${S[key]===value?'sel':''}" onclick="choose('${key}','${value}')"><span>${text}<i>${sub||''}</i></span></button>`}
function choose(key,value){S[key]=value;render()}
function next(){set(Math.min(S.screen+1,9),labels[Math.min(S.screen+1,9)])}
function prev(){set(Math.max(S.screen-1,0),labels[Math.max(S.screen-1,0)])}
const labels=['养老金专区','授权确认','税率适配','流动性安全','养老缺口','类别说明','双端分流','客户结果','CRM 工作台','年度复核'];

/* ---------- 结论取数：一切数字从这里来，不在页面里写死 ---------- */
/* 授权与模式共同决定数据等级：全授权 + 具体值 = A；缺失任一项则降级 */
function dataLevel(){
  const a=S.auth;
  if (a.t0 && a.paid && a.record && S.t0Mode==='exact' && S.paidAmount!==null) return 'A';
  if (S.t0Mode==='exact' || S.t0Mode==='range') return 'B';
  return 'C';
}
function levelText(){
  const L=dataLevel();
  if (L==='A') return {tag:'a', name:'A 级 · 已授权核验', note:'三项必要数据均已授权核验'};
  if (L==='B') return {tag:'b', name:'B 级 · 部分核验', note:'部分数据未授权或未确认，结果会明确标注边界'};
  return {tag:'c', name:'C 级 · 证据不足', note:'关键数据未确认，仅说明判断路径'};
}
/* 核心：当前 T0 下的税额结果。未授权 T0 或不知道时返回 null，不虚构数字。 */
function availableLimit(){return S.auth.paid ? Math.max(0,LIMIT-(S.paidAmount||0)) : LIMIT;}
function setPaidAmount(v){S.paidAmount=Math.min(LIMIT,Math.max(0,Number(v)||0));render();}
function result(){
  if (S.t0Mode==='unknown') return null;
  if (S.t0Mode==='range') return null;          // 区间模式只给档位，不给精确税额
  if (!(S.t0 > 0)) return null;
  return saving(S.t0, availableLimit());
}
/* 区间模式下取该区间的税额跨度，用于展示「结论区间宽度」 */
function rangeSpan(){
  if (S.t0Mode!=='range') return null;
  const r=RANGES.find(x=>x.key===S.rangeKey) || RANGES[1];
  const lo = r.key==='r0' ? 36001 : (RANGES[RANGES.indexOf(r)-1] || {hi:0}).hi + 1;
  const hi = r.hi || 1200000;
  const limit=availableLimit();
  return {label:r.label, lo:saving(lo,limit).save, hi:saving(hi,limit).save, loT0:lo, hiT0:hi};
}
function setT0(v){ S.t0=v; S.t0Mode='exact'; render(); }
function setMode(m){ S.t0Mode=m; render(); }
function setRange(k){ S.rangeKey=k; S.t0Mode='range'; render(); }
function toggleAuth(k){
  S.auth[k]=!S.auth[k];
  if (k==='t0' && !S.auth.t0) S.t0Mode='exact';
  render();
}
function revokeAll(){ S.auth={t0:false,paid:false,record:false}; S.paidAmount=null; render(); }
function flowOpt(key,value,text,sub){return `<button class="opt ${S.flow[key]===value?'sel':''}" onclick="chooseFlow('${key}','${value}')"><span>${text}<i>${sub||''}</i></span></button>`}
function chooseFlow(key,value){S.flow[key]=value;render()}
function chooseHuman(channel){S.humanChannel=channel;render()}
function setGapInput(key,value){S[key]=Math.max(0,Number(value)||0);render()}
function openFromCustomer(screen,label){S.returnToCustomer=true;set(screen,label)}
function returnToCustomer(){S.returnToCustomer=false;set(7,'客户结果')}
function recordCrmTask(){S.crmTaskRecorded=true;render()}
function flowHits(){const f=S.flow,h=[];if(f.reserve==='stop')h.push('应急金覆盖不足 3 个月');if(f.spend==='yes')h.push('未来 12 个月有需提前预留的集中支出');if(f.lock==='no')h.push('暂不能接受资金锁定至退休');if(f.understand==='no')h.push('尚未理解领取条件');return h}
function flowComplete(){return Object.values(S.flow).every(v=>v!==null)}
function taxSaving(){ const r=result(); return r ? Math.round(r.save) : null; }
/* 结论层级：门二停止 -> stop；税优有限但仍可参与 -> low；其余 -> go */
function verdict(){
  if (!flowComplete()) return 'incomplete';
  if (flowHits().length) return 'stop';
  const r=result();
  if (r && r.save < 600) return 'low';
  return 'go';
}
function render(){portalBtn.hidden=S.screen<6;const pages=[entry,consent,tax,liquidity,gap,allocation,dual,customerResult,crmResult,review];pages[S.screen]();}
function nav(primary='继续'){foot.innerHTML=`<button class="btn" onclick="next()">${primary}</button>${S.returnToCustomer?'<button class="btn ghost" onclick="returnToCustomer()">← 返回 C 端结果页</button>':(S.screen?'<button class="btn ghost" onclick="prev()">← 上一步</button>':'')}`}
function entry(){main.innerHTML=`<h1>养老金融专区</h1><p class="lead">您已完成公众自测。进入完整判断前，请先确认本次服务的边界。</p><div class="card blue"><h4>从公众自测到完整判断</h4><p class="small">公众自测只使用您自行填写的信息；手机银行将在授权后核验必要数据，并按同一套四道门重新计算。</p></div><div class="card amber"><h4>开始时不会预设您的任何信息</h4><p class="small">授权、T0、应急金和生活计划均由您主动确认。未完成必要信息时，系统只提示补充，不会默认给出“可以参与”。</p></div><div class="card blue"><h4>本次会完成什么</h4><p class="small">税率适配 → 流动性安全 → 养老缺口 → 产品类别说明与综合结论。</p></div><div class="notice">每一道门都可以停止推荐。低税率不会被一票否决；流动性不足时，系统会优先给出“暂缓”。</div><p class="disc">这是参赛项目原型，不连接真实工行系统或个人数据。</p>`;foot.innerHTML='<button class="btn" onclick="next()">开始完整判断</button>'}
function consent(){const a=S.auth;const L=levelText();main.innerHTML=`<div class="gate"><b class="n">01</b><span>授权与数据确认</span></div><h2>只核验完成判断所必需的信息</h2><p class="mut">三项均可独立选择，随时可以撤销。未授权的信息不参与本次结论。</p>
<div class="card blue"><span class="tag ${L.tag}">${L.name}</span><h4 style="margin-top:10px">勾选本次授权核验的数据</h4><div class="opts authbox">
<button class="opt chk ${a.t0?'sel':''}" onclick="toggleAuth('t0')"><span>缴存前全年应纳税所得额 T0<i>${a.t0?'已授权 · 税额按此精确计算':'未授权 · 不计算税额，只说明判断路径'}</i></span></button>
<button class="opt chk ${a.paid?'sel':''}" onclick="toggleAuth('paid')"><span>已缴个人养老金金额<i>${a.paid?'已授权 · 用于计算剩余可缴额度':'未授权 · 不校验剩余额度'}</i></span></button>
<button class="opt chk ${a.record?'sel':''}" onclick="toggleAuth('record')"><span>基础养老权益记录<i>${a.record?'已授权 · 缺口结论可给出具体金额':'未授权 · 缺口只给区间并标注证据不足'}</i></span></button>
</div>${a.paid?`<div class="card green" style="margin:10px 0 0"><h4>确认本年度已缴金额</h4><p class="small">系统用已缴金额计算剩余可缴额度；未确认时，不把 12,000 元当作默认可缴金额。</p><div style="display:flex;align-items:center;gap:8px;margin-top:10px"><input class="t0in" type="number" min="0" max="12000" step="100" value="${S.paidAmount??''}" oninput="setPaidAmount(this.value)" placeholder="例如 3000"><span class="small mut" style="white-space:nowrap">元 / 年</span></div></div>`:''}</div>
<div class="card ${L.tag==='a'?'green':'amber'}"><h4>本次数据等级：${L.name.split(' · ')[1]}</h4><p class="small">${L.note}${a.t0?'':'　T0 未授权，本页后续不展示任何税额数字。'}</p></div>
<div class="notice">数据完整度影响结论精度，不降低保护标准；相同 T0 在手动输入与授权核验下必须得到相同税额。本页可随时撤销授权。</div>`;foot.innerHTML=`<button class="btn" onclick="next()">确认并继续</button><button class="btn ghost" onclick="revokeAll()">撤销本次全部授权</button>${S.screen?'<button class="btn ghost" onclick="prev()">← 上一步</button>':''}`}
function tax(){const r=result();const L=levelText();let body;
  if(!S.auth.t0 && S.t0Mode==='unknown'){
    body=`<div class="card red"><h4 class="stop">T0 未授权，本次不计算税额</h4><p class="small">这不是拒绝判断，而是不虚构数字。返回上一页勾选「缴存前全年应纳税所得额」后即可精确测算。</p></div><div class="card blue"><h4>判断路径仍然完整</h4><p class="small">即使不计算税额，流动性安全与养老缺口两道门仍按相同标准执行 —— 保护标准不随数据等级变化。</p></div>`;
  } else if(S.t0Mode==='unknown'){
    body=`<div class="card amber"><h4>暂时无法确认 T0</h4><p class="small">系统不按猜测的档位给出税额。可改为选择一个收入区间，查看税额大致范围。</p></div>`;
  } else if(S.t0Mode==='range'){
    const sp=rangeSpan();
    body=`<div class="formula">T0 落在 <b>${sp.label}</b> 区间（示例取值 ${money(sp.loT0)} – ${money(sp.hiT0)} 元）<br>按 12,000 元缴存，当期少缴税款约 <b>${money(sp.lo)} – ${money(sp.hi)} 元</b><br>区间宽度的来源：未确认具体金额，无法收敛到单一档位</div><div class="card amber"><h4>这是区间，不是结论</h4><p class="small">要得到确切数字，请选择「填写具体金额」。区间不影响流动性安全与养老缺口的通过标准。</p></div>`;
  } else if(r){
    const seg=t=>breakdown(t).filter(x=>x.amt>0).map(x=>`${money(x.amt)} × ${pct(x.rate)}`).join(' + ');
    body=`<div class="formula">缴存前 T0 = <b>${money(S.t0)}</b> 元　当前最高档 ${pct(r.rb)}<br>${seg(S.t0)} = ${money(r.before)} 元<br>缴存后 T1 = <b>${money(r.t1)}</b> 元<br>${seg(r.t1)} = ${money(r.after)} 元<br><br>当期少缴税款 = ${money(r.before)} − ${money(r.after)} = <b>${money(r.save)} 元</b></div>
<div class="card ${r.save<600?'amber':'green'}"><h4>${r.save<600?'税优有限，不等于不能参与':'税率适配通过'}</h4><p class="small">${r.save<600?'系统不因低税率停止判断；是否参与仍需看流动性安全与养老缺口。':'继续核验资金安全边界。'}</p></div>
${r.cross?`<details class="card blue" open><summary style="cursor:pointer;font-weight:700;color:var(--navy)">本例跨档，必须分段计算</summary><p class="small" style="margin:10px 0 0">如果直接用「缴存额 × 最高档」，会算成 ${money(r.naive)} 元，比实际多报 ${money(r.naive-r.save)} 元。系统自动分段，不采用这种算法。</p></details>`:''}`;
  }
  main.innerHTML=`<div class="gate"><b class="n">02</b><span>第一道门 · 税率适配</span></div><h2>税优空间需要按 T0 分段计算</h2><p class="mut">T0 是扣除基本减除费用、专项扣除及专项附加扣除后的全年应纳税所得额，不是月薪或税前收入。</p>
<div class="card blue"><span class="tag ${L.tag}">${L.name}</span><h4 style="margin-top:10px">选择你的 T0 口径</h4><div class="opts" style="margin:10px 0 0">${opt('t0Mode','exact','填写具体金额','最准确：按七档税率表逐段计算')}${opt('t0Mode','range','选择收入区间','不知道确切金额时使用，结论以区间呈现')}${opt('t0Mode','unknown','暂时无法确认','系统不猜档位')}</div>
