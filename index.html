<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工银智养仓 · 公众适配自测</title>
<style>
:root{
  /* 工行体系色 —— 全部实测自《封稿精简表格版》PDF */
  --icbc:#D00F1B;      /* 工行红：品牌标识 + 标题红线（线条色 TOP1，80 次） */
  --icbc-dk:#A50C15;   /* 深一档，按钮 hover */
  --navy:#12335B;      /* 深藏青：书中 742 次 */
  --ink:#243244;       /* 正文色：全书主力，21841 次 */
  --ink2:#65758A;
  --gray:#5C6E85;
  --line:#D8E0E9;
  --line2:#E2E7EC;
  --green:#4A7C69;     /* 正向 / 继续 */
  --amber:#B8893E;     /* 待完善 / 补充 */
  --blue:#2466A8;      /* 信息 / 中性强调 */
  --l-red:#FBF0F1;
  --l-blue:#EDF4FB;
  --l-green:#EEF4F1;
  --l-amber:#FAF4E9;
  --l-gray:#F7F9FC;
  --bg:#F4F6F9; --card:#fff;
  --r:4px;             /* 全书通体直角，圆角压到 4px */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.78;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--card);
  box-shadow:0 0 40px rgba(18,51,91,.08);display:flex;flex-direction:column}

/* 顶栏 —— 仿方案书页眉 */
header{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);padding:13px 20px 9px}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:20px;height:20px;border-radius:2px;background:var(--icbc);position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:5px 4px;
  border-left:2px solid #fff;border-bottom:2px solid #fff}
.brand b{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:.2px}
.brand i{font-style:normal;font-size:10px;color:var(--icbc);font-weight:700;
  border:1px solid var(--icbc);border-radius:2px;padding:0 4px;margin-left:1px;
  line-height:1.5;display:inline-block}
.brand span{font-size:11px;color:var(--ink2);margin-left:auto;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
.bar{height:2.5px;background:var(--line2);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--icbc);
  transition:width .45s cubic-bezier(.4,0,.2,1)}

/* 内容 */
main{flex:1;padding:22px 20px 30px}
.pane{display:none;animation:in .38s ease both}
.pane.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{font-size:21px;line-height:1.5;font-weight:700;color:var(--ink);
  margin:0 0 12px;letter-spacing:-.1px}
h1::after{content:"";display:block;width:46px;height:2.5px;background:var(--icbc);
  margin-top:11px}
h2{font-size:17px;line-height:1.55;font-weight:700;color:var(--ink);margin:0 0 10px}
h3{font-size:14.5px;font-weight:700;color:var(--navy);margin:22px 0 8px;
  padding-left:8px;border-left:2.5px solid var(--icbc)}
p{margin:0 0 12px}
.lead{font-size:15px;color:var(--ink)}
.mut{color:var(--ink2);font-size:13.5px;line-height:1.72}
.small{font-size:12.5px;color:var(--ink2)}

/* 强调 —— 红只做品牌与语义，不作装饰 */
.hl{color:var(--icbc);font-weight:700}
.hlb{color:var(--blue);font-weight:700}
.mark{background:linear-gradient(transparent 62%, #F3D5D8 62%);font-weight:700;color:var(--ink)}
em{font-style:normal;background:var(--l-blue);padding:1px 5px;border-radius:2px;
  font-weight:700;color:var(--navy)}

/* 卡片 —— 直角 + 细线，仿方案书卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;margin:0 0 13px}
.card.blue{background:var(--l-blue);border-color:#C7DCF0}
.card.red{background:var(--l-red);border-color:#EFCDD1}
.card.green{background:var(--l-green);border-color:#CFE0D8}
.card.amber{background:var(--l-amber);border-color:#EBDCBF}
.card h4{margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--navy)}
.card.red h4{color:var(--icbc)}

/* 人物台词 */
.say{display:flex;gap:10px;margin:0 0 14px;align-items:flex-start}
.av{width:32px;height:32px;border-radius:50%;background:var(--l-blue);flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--blue)}
.av.b{background:var(--l-red);color:var(--icbc)}
.bub{background:var(--l-blue);border-radius:2px 8px 8px 8px;padding:10px 13px;
  font-size:13.5px;line-height:1.7;flex:1}
.say.r .bub{background:var(--l-red);border-radius:8px 2px 8px 8px}
.say.r{flex-direction:row-reverse}

/* 数字 */
.num{font-family:"DIN Alternate","Bahnschrift",Consolas,monospace;
  font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.5px}
.big{font-size:32px;color:var(--ink);line-height:1.1;display:block;margin:2px 0 2px}
.big.b{color:var(--blue)}
.big.g{color:var(--green)}

/* 算式 */
.calcbox{background:var(--l-gray);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin:0 0 13px;font-size:13px;overflow-x:auto}
.calcbox .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px dashed var(--line);min-width:0}
.calcbox .row:last-child{border-bottom:0;padding-bottom:0}
.calcbox .row>span:first-child{min-width:0;overflow-wrap:break-word}
.calcbox .row>span:last-child{flex:none;white-space:nowrap}
.calcbox .row.tot{border-top:1.5px solid var(--navy);border-bottom:0;
  margin-top:6px;padding-top:9px;font-weight:700;color:var(--navy)}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px;
  font-variant-numeric:tabular-nums}
.del{text-decoration:line-through;color:var(--ink2)}

/* 表单 */
.q{margin:0 0 24px}
.q>label{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.q .hint{font-size:12.5px;color:var(--ink2);margin-bottom:11px;line-height:1.62}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
  width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;font-size:14.5px;line-height:1.5;background:#fff;
  transition:all .18s ease;display:flex;align-items:center;gap:10px;
  min-width:0}
.opt:hover{border-color:#B9C5D0}
.opt .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid #B9C5D0;flex:none;
  position:relative;transition:all .18s ease}
.opt.sel{border-color:var(--icbc);background:var(--l-red)}
.opt.sel .rd{border-color:var(--icbc);border-width:4.5px}
.opt .txt{flex:1;min-width:0;overflow-wrap:break-word;word-break:break-word}
.opt .txt i{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px}
.exactbox{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--l-gray);margin-bottom:16px}
.t0formula{border:1px solid #C7DCF0;border-radius:var(--r);background:var(--l-blue);padding:13px 14px;margin:0 0 18px}
.t0formula .formula-title{font-weight:700;color:var(--navy);margin-bottom:8px;font-size:13.5px}
.t0formula .formula-line{font-size:14px;line-height:1.75;color:var(--ink)}
.t0formula .formula-result{border-top:1px solid #C7DCF0;margin-top:8px;padding-top:8px;font-weight:700;color:var(--blue)}
.t0warning{border-left:3px solid var(--icbc);background:var(--l-red);padding:10px 12px;margin:0 0 18px;font-weight:700;color:var(--icbc);font-size:13.5px}
.exactrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.exactrow input{min-width:0;flex:1;border:1px solid #B9C5D0;border-radius:var(--r);padding:11px 12px;font:inherit;color:var(--ink);background:#fff}
.exactrow input:focus{outline:2px solid rgba(208,15,27,.16);border-color:var(--icbc)}
.exactrow span{white-space:nowrap;color:var(--ink2);font-size:13px}
.orline{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:12.5px;margin:16px 0 8px}
.orline::before,.orline::after{content:"";height:1px;background:var(--line);flex:1}
.sliderow{margin:0 0 22px}
.sliderow .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.sliderow .top label{font-size:15px;font-weight:700;color:var(--ink)}
.sliderow .top .val{font-size:18px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--icbc) var(--p,50%),#E2E7EC var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:#fff;border:2px solid var(--icbc);margin-top:-8px;
  box-shadow:0 1px 3px rgba(18,51,91,.2);cursor:pointer}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#E2E7EC}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;
  background:#fff;border:2px solid var(--icbc);cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}

/* 按钮 —— 工行红为唯一主行动色 */
.btn{display:block;width:100%;border:0;border-radius:var(--r);padding:14px;
  font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;
  background:var(--icbc);color:#fff;transition:all .18s ease;letter-spacing:.3px}
.btn:hover{background:var(--icbc-dk)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--l-gray);border-color:#B9C5D0}
.btn.blue{background:var(--navy)}
.btn.blue:hover{background:#0D2846}
.btn[disabled]{background:#C9D3DE;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin-top:8px}
.btnrow .btn{flex:1}
.foot{padding:0 20px 26px}

/* 结论页 —— 语义色沿用书中「继续/补充/停止」体系 */
.verdict{border-radius:var(--r);padding:20px 18px;margin:0 0 18px;text-align:center;
  border:1px solid;border-top-width:3px}
.verdict .tag{display:inline-block;font-size:11px;font-weight:700;
  padding:2px 9px;border-radius:2px;margin-bottom:11px;letter-spacing:.5px;
  border:1px solid}
.verdict h2{margin:0 0 8px;font-size:21px}
.verdict .sub{font-size:13px;line-height:1.7}
.v-go{background:var(--l-green);border-color:#CFE0D8;border-top-color:var(--green)}
.v-go .tag{color:var(--green);border-color:var(--green);background:#fff}
.v-go h2{color:var(--green)}
.v-less{background:var(--l-amber);border-color:#EBDCBF;border-top-color:var(--amber)}
.v-less .tag{color:var(--amber);border-color:var(--amber);background:#fff}
.v-less h2{color:var(--amber)}
.v-stop{background:var(--l-red);border-color:#EFCDD1;border-top-color:var(--icbc)}
.v-stop .tag{color:var(--icbc);border-color:var(--icbc);background:#fff}
.v-stop h2{color:var(--icbc)}
.v-human{background:var(--l-blue);border-color:#C7DCF0;border-top-color:var(--blue)}
.v-human .tag{color:var(--blue);border-color:var(--blue);background:#fff}
.v-human h2{color:var(--blue)}

/* 折叠 */
.acc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 13px}
.acc>.hd{padding:13px 14px;background:var(--l-gray);cursor:pointer;
  display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--navy)}
.acc>.hd::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink2);
  border-bottom:1.5px solid var(--ink2);transform:rotate(45deg);
  margin-left:auto;transition:transform .22s ease;flex:none;margin-top:-3px}
.acc.open>.hd::after{transform:rotate(-135deg);margin-top:3px}
.acc>.bd{display:none;padding:4px 14px 14px;border-top:1px solid var(--line)}
.acc.open>.bd{display:block}

/* 等级徽 —— 沿用书中「继续/补充/停止」语义色 */
.lvl{display:inline-block;font-size:12px;
  padding:3px 9px;border-radius:2px;font-weight:700;border:1px solid}
.lvl.A{background:var(--l-green);color:var(--green);border-color:#CFE0D8}
.lvl.B{background:var(--l-amber);color:var(--amber);border-color:#EBDCBF}
.lvl.C{background:#EFF1F4;color:var(--ink2);border-color:var(--line)}

/* 门步骤 */
.gatehead{display:flex;align-items:center;gap:9px;margin:0 0 15px}
.gnum{width:24px;height:24px;border-radius:2px;background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.gnum.brk{background:var(--icbc)}
.gnum.warn{background:var(--amber)}
.gtitle{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.6px}

/* 三支柱条 */
.pillar{display:flex;gap:6px;margin:14px 0}
.pillar div{flex:1;border-radius:var(--r);padding:11px 7px;text-align:center;font-size:11.5px;
  line-height:1.5;border:1px solid}
.pillar b{display:block;font-size:12px;margin-bottom:3px}
.p1{background:var(--l-blue);border-color:#C7DCF0;color:var(--navy)}
.p2{background:var(--l-green);border-color:#CFE0D8;color:var(--green)}
.p3{background:var(--l-amber);border-color:#EBDCBF;color:var(--amber)}

/* 免责 */
.disc{font-size:11px;color:var(--ink2);line-height:1.68;
  border-top:1px solid var(--line);padding-top:11px;margin-top:20px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(70px);
  background:rgba(36,50,68,.95);color:#fff;font-size:13px;padding:10px 18px;
  border-radius:var(--r);opacity:0;transition:all .3s ease;z-index:99;pointer-events:none;
  max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.checkbadge{display:inline-block;font-size:10.5px;background:var(--l-green);color:var(--green);
  padding:2px 7px;border-radius:2px;font-weight:700;margin-left:6px;
  border:1px solid #CFE0D8}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <b>ICBC 工银智养仓</b><i>养老金融</i>
      <span id="stepTxt">政策了解</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==========================================================================
   一、计算引擎 —— 与 engine.py 逐字对应，自检必须全过
   ========================================================================== */
const BRACKETS = [
  [36000, .03], [144000, .10], [300000, .20], [420000, .25],
  [660000, .30], [960000, .35], [null, .45]
];
const LIMIT = 12000;

function taxOf(t0){
  if (!(t0 > 0)) return 0;
  let total = 0, low = 0;
  for (const [cap, rate] of BRACKETS){
    if (cap === null || t0 <= cap){ total += (t0 - low) * rate; break; }
    total += (cap - low) * rate; low = cap;
  }
  return total;
}
function rateOf(t0){
  for (const [cap, rate] of BRACKETS) if (cap === null || t0 <= cap) return rate;
  return 0;
}
function breakdown(t0){
  const rows = [];
  if (!(t0 > 0)) return rows;
  let low = 0;
  for (const [cap, rate] of BRACKETS){
    const hi = (cap === null) ? t0 : Math.min(t0, cap);
    if (hi > low) rows.push({low, amt: hi - low, rate, tax: (hi - low) * rate});
    if (cap === null || t0 <= cap) break;
    low = cap;
  }
  return rows;
}
function saving(t0, deposit){
  deposit = Math.max(0, Math.min(deposit == null ? LIMIT : deposit, LIMIT));
  const t1 = Math.max(0, t0 - deposit);
  const before = taxOf(t0), after = taxOf(t1);
  return {
    t0, deposit, t1, before, after,
    save: before - after,
    naive: deposit * rateOf(t0),
    cross: rateOf(t1) !== rateOf(t0),
    rb: rateOf(t0), ra: rateOf(t1)
  };
}
/* 自检：与 engine.py 的 ALL PASS 一致 */
function selfTest(){
  const cases = [[42000,780],[180000,2400],[500000,3600],[36000,360],[24000,360],[0,0],[1200000,5400]];
  const bad = [];
  for (const [t0, want] of cases){
    const got = Math.round(saving(t0, LIMIT).save);
    if (got !== want) bad.push(`T0=${t0} 得 ${got} 期望 ${want}`);
  }
  return bad;
}

/* ==========================================================================
   二、格式化
   ========================================================================== */
const yuan = n => {
  const v = Math.round(n);
  return v.toLocaleString('zh-CN');
};
const pct = r => Math.round(r * 100) + '%';

/* ==========================================================================
   三、状态
   ========================================================================== */
const S = {
  stepIdx: 0,
  T0: null,          // 全年应纳税所得额
  T0Min: null,       // 区间输入下界
  T0Max: null,       // 区间输入上界，null 表示无明确上界
  t0Mode: '',        // exact / range / unknown
  t0Source: '',      // 这个数字怎么来的
  income: null,      // 税前月收入（用于换算提示）
  reserve: null,     // 应急金覆盖月数
  bigCost: null,     // 未来12个月重大支出
  lock: null,        // 锁定期接受度
  plan: null,        // 养老安排
  depth: null,       // 信息深度 A/B/C
  hasCert: false,
  gate: {tax:'', flow:'', plan:''},
  reasons: []
};

/* 三道门的判断 —— 对应方案书 3.4 模块一/二 */
function judge(){
  const s = S.t0Mode === 'exact' ? saving(S.T0, LIMIT) : null;
  S.reasons = [];
  const g = {tax:'', flow:'', final:''};

  /* 门一：税优测算 */
  if (S.t0Mode === 'unknown'){
    g.tax = 'unknown';
    S.reasons.push({k:'税优', t:'目前还无法确认应纳税所得额，因此不生成精确减税数字', lv:'amber'});
  } else if (S.t0Mode === 'range'){
    const lo = saving(S.T0Min, LIMIT).save;
    const hi = S.T0Max === null ? LIMIT * .45 : saving(S.T0Max, LIMIT).save;
    g.tax = 'range';
    S.reasons.push({k:'税优', t:`按所选区间，缴满 ${yuan(LIMIT)} 元的当期减税额约为 ${yuan(lo)}～${yuan(hi)} 元；是否跨档需要具体金额才能确认`, lv:'blue'});
  } else if (S.T0 === null || S.T0 <= 0){
    g.tax = 'none';
    S.reasons.push({k:'税优', t:'当前没有应纳税所得额，缴费环节没有可抵扣的空间', lv:'red'});
  } else if (S.T0 <= 36000){
    g.tax = 'weak';
    S.reasons.push({k:'税优', t:`处于 ${pct(s.rb)} 档，缴满 ${yuan(LIMIT)} 元当期最多减税 ${yuan(s.save)} 元——税优有限，但仍要看这笔钱锁住对你意味着什么`, lv:'amber'});
  } else if (s.cross){
    g.tax = 'cross';
    S.reasons.push({k:'税优', t:`缴存会让你从 ${pct(s.rb)} 档落到 ${pct(s.ra)} 档，实际减税 ${yuan(s.save)} 元，低于按 ${pct(s.rb)} 直接计算的 ${yuan(s.naive)} 元`, lv:'blue'});
  } else {
    g.tax = 'ok';
    S.reasons.push({k:'税优', t:`处于 ${pct(s.rb)} 档，缴满 ${yuan(LIMIT)} 元当期可减税 ${yuan(s.save)} 元`, lv:'blue'});
  }

  /* 门二：流动性安全体检 —— 四类暂缓情形 */
  const flowHits = [];
  if (S.reserve !== null && S.reserve < 3) flowHits.push('应急储备不足 3 个月');
  if (S.bigCost === 'yes') flowHits.push('未来 12 个月有明确的大额支出');
  if (S.lock === 'no') flowHits.push('不能接受资金锁定到退休');
  if (S.lock === 'unsure') flowHits.push('尚未理解领取条件');

  if (flowHits.length){
    g.flow = 'stop';
    flowHits.forEach(h => S.reasons.push({k:'流动性', t:h, lv:'red'}));
  } else {
    g.flow = 'pass';
    S.reasons.push({k:'流动性', t:'应急储备与近期支出均未触发停止条件', lv:'green'});
  }

  /* 深入自测第三步：养老安排信息不足时转入补充路径，不直接暂缓。 */
  if (S.plan === 'none'){
    g.plan = 'incomplete';
    S.reasons.push({k:'养老安排信息', t:'目前还没有清晰的养老安排，现有信息不足以判断合理缴存金额；进入手机银行后还需补充养老目标和资产信息', lv:'amber'});
  } else if (S.plan === 'social'){
    g.plan = 'pass';
    S.reasons.push({k:'养老安排', t:'已有基本养老保险，补充养老储备尚未开始，可结合长期目标继续评估', lv:'green'});
  } else {
    g.plan = 'pass';
    S.reasons.push({k:'养老安排', t:'已有一定养老储备安排，可纳入整体框架一并判断', lv:'green'});
  }

  /* 结论 */
  if (g.flow === 'stop'){
    g.final = 'stop';
  } else if (g.tax === 'unknown' || g.tax === 'range' || g.plan === 'incomplete'){
    g.final = 'human';
  } else if (g.tax === 'none' || g.tax === 'weak'){
    g.final = 'less';   /* 无税优或3%档不会被税率一票否决 */
  } else if (g.tax === 'cross'){
    g.final = 'less';   /* 跨档：可参与，但继续缴存部分的边际税优会下降 */
  } else {
    g.final = 'go';
  }
  S.gate = g;
  return g;
}

        口径：以缴存前全年应纳税所得额为起点分段计算；缴存限额 ${yuan(LIMIT)} 元/年；
        领取环节按 3% 单独计税。<span class="checkbadge">计算已通过自检</span>
      </div>`;

    foot.innerHTML = `

  pick(el, key, value){
    LIGHT[key] = value;
    document.querySelectorAll(`.opt[data-group="${key}"]`).forEach(o => {

  restore(){

      if (!LIGHT[key]) continue;

    main.innerHTML = `

      <p class="lead mut">公开深入自测已经完成。下一阶段需要本人重新确认并授权必要信息。</p>

      <div class="card blue">
        <h4>公众适配自测 · B / C 级</h4>
        <p class="mut" style="margin:8px 0 0;font-size:13.5px">

      </div>
      <div style="text-align:center;color:var(--gray);font-weight:700;margin:8px 0">↓ 本人确认与授权</div>
      <div class="card green">
        <h4>手机银行完整判断 · A 级可核验数据</h4>
        <p class="mut" style="margin:8px 0 0;font-size:13.5px">

          税率适配 → 流动性安全 → 养老缺口 → 组合配置与综合结论。只有前三道判断支持继续、且用户主动选择了解时，才进入类别说明。</p>

};

function startDeep(){
  /* 点击“继续”即表示用户愿意沿用刚才两项非敏感选择，进入更深入的手动自测。 */
  f2.big = LIGHT.big;
  f2.lock = LIGHT.lock;
  S.bigCost = LIGHT.big;
  S.lock = LIGHT.lock;
  go('f1');
}

/* --------------------------------------------------------------------------
   路由：三问轻量筛查 + 公开深入自测 + 银行端衔接
   -------------------------------------------------------------------------- */
const VIEWS = {open:light.open, quick:light.quick, lightResult:light.result,
               case:scenes.case, f1:f1.render, f2:f2.render, f3:f3.render,
               result:result.render, handoff:light.handoff};

function go(name){
  if (name === 'f2'){
    f2.reserve = (typeof S.reserve === 'number' && S.reserve >= 0) ? S.reserve : 6;
    f2.big  = (S.bigCost === undefined) ? null : S.bigCost;
    f2.lock = (S.lock    === undefined) ? null : S.lock;
  }
  const v = VIEWS[name];
  if (typeof v !== 'function'){ console.warn('unknown view', name); return; }
  v.call(null);
}
window.go = go;
function restart(){
  Object.assign(S, {stepIdx:0, T0:null, T0Min:null, T0Max:null, t0Mode:'', t0Source:'',
                    reserve:null, bigCost:null, lock:null, plan:null, depth:null, reasons:[]});
  f2.big = null; f2.lock = null; f2.reserve = 6;
  Object.assign(LIGHT, {base:null, big:null, lock:null});
  go('open');
}
/* 暴露给演示/截图脚本 */
window.S = S; window.saving = saving; window.taxOf = taxOf;
window.breakdown = breakdown; window.selfTest = selfTest;
window.restart = restart;
window.LIGHT = LIGHT; window.light = light;
window.f1 = f1; window.f2 = f2; window.f3 = f3; window.startDeep = startDeep;

/* 启动：先跑自检，不过就在控制台报警 */
(function boot(){
  const bad = selfTest();
  if (bad.length) console.error('[引擎自检未通过]', bad);
  go('open');
})();
</script>
